    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        const root    = document.querySelector('[data-composition-id="beat-3-quote-hook"]');
        const ghost   = root.querySelector('.ghost-two');
        const line1   = root.querySelector('.line-1');
        const line2   = root.querySelector('.line-2');
        const line3   = root.querySelector('.line-3');
        const fill    = root.querySelector('.progress-fill');
        const dot     = root.querySelector('.progress-dot');
        const stepLbl = root.querySelector('.step-label');
        const spkA    = root.querySelector('.sparkle-a');
        const spkB    = root.querySelector('.sparkle-b');
        const spkC    = root.querySelector('.sparkle-c');

        const tl = gsap.timeline({ paused: true });

        // ── 1. Ghost "2" fades in — opacity 0 → 0.9, t=0 ──
        // xPercent/yPercent used for centering so GSAP owns the full transform matrix
        tl.fromTo(ghost,
          { opacity: 0, xPercent: -50, yPercent: -50 },
          { opacity: 0.9, xPercent: -50, yPercent: -50, duration: 0.55, ease: 'power1.out' },
          0
        );

        // ── 2. Line 1: "Getting a quote" — fades up, t=0.1s ──
        tl.fromTo(line1,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.45, ease: 'expo.out' },
          0.1
        );

        // ── 3. Line 2: "takes less than" — fades up, t=0.25s ──
        tl.fromTo(line2,
          { opacity: 0, y: 15 },
          { opacity: 1, y: 0, duration: 0.4, ease: 'power3.out' },
          0.25
        );

        // ── 4. "2 MINUTES" — elastic scale in, t=0.45s ──
        tl.fromTo(line3,
          { opacity: 0, scale: 0.8 },
          { opacity: 1, scale: 1.0, duration: 0.65, ease: 'elastic.out(1, 0.6)' },
          0.45
        );

        // ── 5. Progress bar fill: width 0 → 100% over 1.2s, t=0.3s ──
        tl.fromTo(fill,
          { width: '0px' },
          { width: '1920px', duration: 1.2, ease: 'power1.out' },
          0.3
        );

        // ── 6. Riding dot: x 0 → 1880 over 1.2s, t=0.3s ──
        tl.fromTo(dot,
          { x: 0 },
          { x: 1880, duration: 1.2, ease: 'power1.out' },
          0.3
        );

        // ── 7. Step label fades in, t=0.5s ──
        tl.fromTo(stepLbl,
          { opacity: 0 },
          { opacity: 1, duration: 0.35, ease: 'power2.out' },
          0.5
        );

        // ── 8. Sparkles fade in staggered ──
        tl.fromTo(spkA,
          { opacity: 0 },
          { opacity: 0.15, duration: 0.3, ease: 'power1.out' },
          0.2
        );
        tl.fromTo(spkB,
          { opacity: 0 },
          { opacity: 0.15, duration: 0.3, ease: 'sine.out' },
          0.35
        );
        tl.fromTo(spkC,
          { opacity: 0 },
          { opacity: 0.15, duration: 0.25, ease: 'power2.out' },
          0.55
        );

        window.__timelines['beat-3-quote-hook'] = tl;
      })();
    </script>
