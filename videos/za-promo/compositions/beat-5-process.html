        <line

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var tl = gsap.timeline({ paused: true });

        var BEAT = 6.1;

        // ─── 0. Background radial fade in ───────────────────────────────
        tl.fromTo(
          ".bg-panel",
          { opacity: 0 },
          { opacity: 1, duration: 0.8, ease: "power1.out" },
          0
        );

        // ─── 0. Corner marks ────────────────────────────────────────────
        tl.fromTo(
          ".corner-mark",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" },
          0.05
        );
        tl.fromTo(
          ".corner-mark-br",
          { opacity: 0, scale: 0.5 },
          { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out" },
          0.15
        );

        // ─── 1. Ghost image: parent opacity fade-in ─────────────────────
        //    Child handles the slow x-drift (Ken Burns right)
        //    Split parent/child to avoid stacking transforms on one element
        tl.fromTo(
          ".ghost-wrap",
          { opacity: 0 },
          { opacity: 0.08, duration: 1.2, ease: "power1.inOut" },
          0
        );
        // Slow drift right +15px on child over full beat
        tl.fromTo(
          ".ghost-img",
          { x: 0 },
          { x: 15, duration: BEAT, ease: "none" },
          0
        );

        // ─── 2. Eyebrow ─────────────────────────────────────────────────
        tl.fromTo(
          ".eyebrow",
          { opacity: 0, letterSpacing: "0.05em" },
          { opacity: 1, letterSpacing: "0.2em", duration: 0.55, ease: "power2.out" },
          0.1
        );

        // ─── 3. Heading: fades up from y:30 ─────────────────────────────
        tl.fromTo(
          ".heading",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.65, ease: "expo.out" },
          0.2
        );

        // ─── 4. Subtitle: fades up ───────────────────────────────────────
        tl.fromTo(
          ".subtitle",
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.5
        );

        // ─── 5. SVG connector base line draws left → right ────────────────
        // strokeDashoffset 1160 → 0 means the line draws itself
        tl.fromTo(
          "#conn-base",
          { strokeDashoffset: 1160 },
          { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" },
          0.8
        );

        // ─── 5b. Accent dot travels the path ─────────────────────────────
        // A short "dot" segment rides the line using dasharray trick:
        // dasharray = [dotLen, rest] and dashoffset sweeps from full to 0
        // dotLen = 12px (tight), total line = 1160, so offset sweeps 1160 → 0
        // but we need the dot at the front: use dasharray [12, 1148] and offset sweeps 1160+12=1172 → 12
        tl.fromTo(
          "#conn-traveller",
          { strokeDasharray: "12 1148", strokeDashoffset: 1172 },
          { strokeDashoffset: 12, duration: 0.8, ease: "power1.inOut" },
          1.8
        );

        // ─── 6. Card 1 fades up ──────────────────────────────────────────
        tl.fromTo(
          "#card1",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.4)" },
          1.0
        );

        // ─── 7. Card 2 fades up ──────────────────────────────────────────
        tl.fromTo(
          "#card2",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
          1.6
        );

        // ─── 8. Card 3 fades up ──────────────────────────────────────────
        tl.fromTo(
          "#card3",
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.55, ease: "expo.out" },
          2.2
        );

        // ─── 8b. Green glow pulse on icon3 ──────────────────────────────
        // yoyo pulse: 0→12px glow, repeating
        // Glow cycle = 0.4s each way × 2 (yoyo) = 0.8s per full cycle
        // Calculate finite repeat from t=2.8 to beat end (6.1): window = 3.3s → ceil(3.3/0.4)-1 = 7
        var glowRepeat = Math.ceil(3.3 / 0.4) - 1; // = 7
        tl.fromTo(
          "#icon3",
          { filter: "drop-shadow(0 0 0px #00C951)" },
          {
            filter: "drop-shadow(0 0 12px #00C951)",
            duration: 0.4,
            yoyo: true,
            repeat: glowRepeat,
            ease: "sine.inOut"
          },
          2.8
        );

        // ─── 10. Connector dots appear at card times ────────────────────
        tl.fromTo(
          "#conn-dot-1",
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" },
          1.0
        );
        tl.fromTo(
          "#conn-dot-2",
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" },
          1.6
        );
        tl.fromTo(
          "#conn-dot-3",
          { opacity: 0, scale: 0 },
          { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" },
          2.2
        );

        // ─── Bottom rule draws in ────────────────────────────────────────
        tl.fromTo(
          ".bottom-rule",
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" },
          3.2
        );

        // ─── 9. Guarantee badge bounces in ──────────────────────────────
        // Animate the wrapper (no CSS transform on wrapper, so GSAP won't conflict)
        tl.fromTo(
          "#guarantee-badge-wrap",
          { opacity: 0, scale: 0.8, y: 20 },
          { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "elastic.out(1, 0.5)" },
          3.8
        );

        window.__timelines["beat-5-process"] = tl;
      })();
    </script>
