<template id="beat-6-stats-template">
  <div data-composition-id="beat-6-stats" data-width="1920" data-height="1080" data-start="0" style="position:relative;width:1920px;height:1080px;overflow:hidden;font-family:'Geist',sans-serif;">
    <style>

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    .composition-frame {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #0D3B66;
      font-family: 'Geist', sans-serif;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 1 — Radial glow                                                  */
    /* -------------------------------------------------------------------- */
    .radial-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(circle, #1A548E 0%, transparent 70%);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 7 — Decorative check marks (background texture)                  */
    /* -------------------------------------------------------------------- */
    .check-texture {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .check-mark {
      position: absolute;
      font-size: 20px;
      color: #ffffff;
      opacity: 0.08;
      user-select: none;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 2 — Ghost text "TRUSTED"                                         */
    /* -------------------------------------------------------------------- */
    .ghost-text {
      position: absolute;
      top: 60px;
      left: -60px;
      font-size: 260px;
      font-weight: 800;
      color: #1A548E;
      opacity: 0.25;
      white-space: nowrap;
      line-height: 1;
      user-select: none;
      pointer-events: none;
      z-index: 2;
      will-change: transform;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 3 — Eyebrow label                                                */
    /* -------------------------------------------------------------------- */
    .eyebrow {
      position: absolute;
      top: 108px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.65);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      z-index: 10;
      will-change: opacity;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 4 — Stats 2×2 grid                                              */
    /* -------------------------------------------------------------------- */
    .stats-grid {
      position: absolute;
      top: 200px;
      left: 0;
      right: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 40px 120px;
      width: 1100px;
      margin: 0 auto;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 440px;
      will-change: opacity, transform;
    }

    .stat-number {
      font-size: 96px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1;
      will-change: transform;
    }

    .stat-label {
      font-size: 20px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 12px;
      text-align: center;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 5 — Gold stars                                                   */
    /* -------------------------------------------------------------------- */
    .stars-row {
      position: absolute;
      top: 560px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      z-index: 10;
    }

    .star {
      font-size: 40px;
      color: #F59E0B;
      line-height: 1;
      will-change: opacity, transform;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 6 — Testimonial card                                             */
    /* -------------------------------------------------------------------- */
    .testimonial-card {
      position: absolute;
      top: 650px;
      left: 50%;
      transform: translateX(-50%);
      width: 1000px;
      background: #ffffff;
      border-radius: 14px;
      border-left: 4px solid #2563EB;
      padding: 40px 48px;
      z-index: 10;
      will-change: opacity, transform;
    }

    .testimonial-quote {
      font-size: 28px;
      font-weight: 500;
      color: #0D3B66;
      line-height: 1.45;
      margin-bottom: 20px;
    }

    .testimonial-attribution {
      font-size: 20px;
      font-weight: 400;
      color: #64748B;
    }

    /* -------------------------------------------------------------------- */
    /* Layer 8 — Bottom accent line                                           */
    /* -------------------------------------------------------------------- */
    .accent-line-wrap {
      position: absolute;
      top: 614px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      z-index: 10;
      pointer-events: none;
    }

    .accent-line-svg {
      display: block;
      overflow: visible;
    }

    .accent-line-path {
      stroke: #2563EB;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
    }
  
    </style>


    <!-- Layer 1: Radial glow -->
    <div class="radial-glow" id="radial-glow"></div>

    <!-- Layer 7: Decorative check marks -->
    <div class="check-texture" id="check-texture">
      <span class="check-mark" style="top: 140px; left: 120px;">✓</span>
      <span class="check-mark" style="top: 340px; left: 80px;">✓</span>
      <span class="check-mark" style="top: 520px; left: 200px;">✓</span>
      <span class="check-mark" style="top: 720px; left: 100px;">✓</span>
      <span class="check-mark" style="top: 200px; right: 140px;">✓</span>
    </div>

    <!-- Layer 2: Ghost text "TRUSTED" -->
    <div class="ghost-text" id="ghost-text">TRUSTED</div>

    <!-- Layer 3: Eyebrow label -->
    <div class="eyebrow" id="eyebrow">OUR TRACK RECORD</div>

    <!-- Layer 4: Stats 2×2 grid -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-item" id="stat-1">
        <div class="stat-number" id="num-1">0+</div>
        <div class="stat-label">HAPPY CLIENTS</div>
      </div>
      <div class="stat-item" id="stat-2">
        <div class="stat-number" id="num-2">0+</div>
        <div class="stat-label">YEARS EXPERIENCE</div>
      </div>
      <div class="stat-item" id="stat-3">
        <div class="stat-number" id="num-3">0%</div>
        <div class="stat-label">DEPOSIT SUCCESS</div>
      </div>
      <div class="stat-item" id="stat-4">
        <div class="stat-number" id="num-4">0mi</div>
        <div class="stat-label">COVERAGE RADIUS</div>
      </div>
    </div>

    <!-- Layer 5: Gold stars -->
    <div class="stars-row" id="stars-row">
      <span class="star" id="star-1">★</span>
      <span class="star" id="star-2">★</span>
      <span class="star" id="star-3">★</span>
      <span class="star" id="star-4">★</span>
      <span class="star" id="star-5">★</span>
    </div>

    <!-- Layer 8: Bottom accent line (under stars) -->
    <div class="accent-line-wrap" id="accent-line-wrap">
      <svg class="accent-line-svg" width="200" height="4" viewBox="0 0 200 4">
        <line
          class="accent-line-path"
          id="accent-line"
          x1="0" y1="2"
          x2="200" y2="2"
          stroke-dasharray="200"
          stroke-dashoffset="200"
        />
      </svg>
    </div>

    <!-- Layer 6: Testimonial card -->
    <div class="testimonial-card" id="testimonial-card">
      <div class="testimonial-quote">
        "Outstanding service. Got my full deposit back without any dispute."
      </div>
      <div class="testimonial-attribution">Sarah Mitchell — Tenant, Glasgow</div>
    </div>

  
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
window.__timelines = window.__timelines || {};

  const tl = gsap.timeline({ paused: true });

  // ── Layer 2: Ghost text ambient drift (full 2.8s) ─────────────────────────
  tl.fromTo(
    "#ghost-text",
    { x: 0 },
    { x: 20, duration: 2.8, ease: "none" },
    0
  );

  // ── Layer 3: Eyebrow fade in at t=0.1s ────────────────────────────────────
  tl.fromTo(
    "#eyebrow",
    { opacity: 0 },
    { opacity: 1, duration: 0.5, ease: "power2.out" },
    0.1
  );

  // ── Layer 4: Stat items fade up ───────────────────────────────────────────
  tl.fromTo(
    "#stat-1",
    { opacity: 0, y: 24 },
    { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
    0.2
  );
  tl.fromTo(
    "#stat-2",
    { opacity: 0, y: 24 },
    { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
    0.4
  );
  tl.fromTo(
    "#stat-3",
    { opacity: 0, y: 24 },
    { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
    0.6
  );
  tl.fromTo(
    "#stat-4",
    { opacity: 0, y: 24 },
    { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
    0.8
  );

  // ── Layer 4: Counter animations using proxy pattern ───────────────────────
  const el1 = document.getElementById("num-1");
  const el2 = document.getElementById("num-2");
  const el3 = document.getElementById("num-3");
  const el4 = document.getElementById("num-4");

  const p1 = { count: 0 };
  tl.fromTo(
    p1,
    { count: 0 },
    {
      count: 500,
      duration: 1.2,
      ease: "power2.out",
      onUpdate: () => { el1.textContent = Math.round(p1.count) + "+"; }
    },
    0.2
  );

  const p2 = { count: 0 };
  tl.fromTo(
    p2,
    { count: 0 },
    {
      count: 12,
      duration: 1.2,
      ease: "power2.out",
      onUpdate: () => { el2.textContent = Math.round(p2.count) + "+"; }
    },
    0.4
  );

  const p3 = { count: 0 };
  tl.fromTo(
    p3,
    { count: 0 },
    {
      count: 100,
      duration: 1.2,
      ease: "power2.out",
      onUpdate: () => { el3.textContent = Math.round(p3.count) + "%"; }
    },
    0.6
  );

  const p4 = { count: 0 };
  tl.fromTo(
    p4,
    { count: 0 },
    {
      count: 50,
      duration: 1.2,
      ease: "power2.out",
      onUpdate: () => { el4.textContent = Math.round(p4.count) + "mi"; }
    },
    0.8
  );

  // ── Layer 4: Scale pop on final value for each counter ────────────────────
  tl.fromTo(
    "#num-1",
    { scale: 1 },
    { scale: 1.06, duration: 0.35, ease: "elastic.out(1,0.4)" },
    1.4
  );
  tl.fromTo(
    "#num-2",
    { scale: 1 },
    { scale: 1.06, duration: 0.35, ease: "elastic.out(1,0.4)" },
    1.6
  );
  tl.fromTo(
    "#num-3",
    { scale: 1 },
    { scale: 1.06, duration: 0.35, ease: "elastic.out(1,0.4)" },
    1.8
  );
  tl.fromTo(
    "#num-4",
    { scale: 1 },
    { scale: 1.06, duration: 0.35, ease: "elastic.out(1,0.4)" },
    2.0
  );

  // ── Layer 5: Gold stars stagger left-to-right from t=1.2s ────────────────
  const stars = ["#star-1", "#star-2", "#star-3", "#star-4", "#star-5"];
  stars.forEach((sel, i) => {
    tl.fromTo(
      sel,
      { opacity: 0, scale: 0.4 },
      { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.7)" },
      1.2 + i * 0.1
    );
  });

  // ── Layer 8: Accent line draws left-to-right at t=2.2s ───────────────────
  tl.fromTo(
    "#accent-line",
    { strokeDashoffset: 200 },
    { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" },
    2.2
  );

  // ── Layer 6: Testimonial card slides up at t=1.5s ─────────────────────────
  tl.fromTo(
    "#testimonial-card",
    { opacity: 0, y: 60 },
    { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
    1.5
  );

  window.__timelines["beat-6-stats"] = tl;
    </script>
  </div>
</template>
